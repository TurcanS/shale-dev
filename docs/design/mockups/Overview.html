<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&amp;family=Martian+Mono:wght@200..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;transition:background-color 140ms ease-out,box-shadow 140ms ease-out,transform 80ms ease-out}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #efece6;outline-offset:2px}
input::placeholder{color:#6b6f76}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
</helmet>
<section aria-label="Overview" style="width: 1240px; height: 580px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: #121316; border-radius: 22px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 60px rgba(0,0,0,0.4); font-family: 'Hanken Grotesk', sans-serif; color: #efece6;">
<header style="display: flex; align-items: center; gap: 12px; height: 34px;">
<span style="font-weight: 650; font-size: 17px;">Pages</span>
<span style="font-size: 13px; color: #8c8f95;">{{status}}</span>
<label style="margin-left: auto; display: flex; align-items: center; gap: 8px; width: 260px; height: 34px; padding: 0 12px; box-sizing: border-box; border-radius: 10px; background: #1c1e22;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8f95" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5L20 20"></path></svg><input value="{{query}}" onChange="{{onQuery}}" placeholder="Find a window" aria-label="Find a window" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #efece6; font: 13px 'Hanken Grotesk', sans-serif;"></label>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 12px;">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 6px; min-height: 0;">
<div style="display: flex; align-items: center; gap: 8px; height: 22px;">
<button onClick="{{p.go}}" aria-current="{{p.current}}" style="padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 8px; cursor: pointer;"><span style="min-width: 20px; height: 20px; border-radius: 6px; background: {{p.numBg}}; color: {{p.numFg}}; display: grid; place-items: center; font-weight: 700; font-size: 11px;">{{p.n}}</span><span style="font-size: 12px; color: #8c8f95;">{{p.meta}}</span></button>
<sc-if value="{{p.canMove}}" hint-placeholder-val="{{ false }}"><button onClick="{{p.moveHere}}" style="margin-left: auto; height: 22px; padding: 0 9px; border-radius: 6px; border: 0; background: {{s.a1}}; color: #17181a; font-weight: 650; font-size: 11px; cursor: pointer;">Move here</button></sc-if>
</div>
<div onClick="{{p.go}}" style="position: relative; flex: 1; border-radius: 12px; overflow: hidden; background: linear-gradient(170deg, {{wall.top}}, {{wall.bottom}}); box-shadow: {{p.ring}}; cursor: pointer;">
<span aria-hidden="true" style="position: absolute; left: 5px; right: 5px; top: 4px; height: 5px; border-radius: 3px; background: rgba(18,19,22,0.8);"></span>
<sc-for list="{{p.wins}}" as="w" hint-placeholder-count="2">
<button onClick="{{w.pick}}" aria-pressed="{{w.on}}" aria-label="{{w.app}}: {{w.title}}" style="position: absolute; left: calc({{w.x}} + 5px); top: calc({{w.y}} * 0.86 + 14px); width: calc({{w.w}} - 10px); height: calc({{w.h}} * 0.86 - 6px); box-sizing: border-box; padding: 8px; border-radius: 8px; border: 0; background: rgba(28,30,34,0.94); box-shadow: {{w.ring}}; opacity: {{w.dim}}; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; overflow: hidden; cursor: pointer;">
<span style="display: flex; align-items: center; gap: 6px; max-width: 100%;"><span style="width: 18px; height: 18px; flex: none; border-radius: 5px; background: {{w.tile}}; color: #17181a; display: grid; place-items: center; font-weight: 700; font-size: 10px;">{{w.initial}}</span><span style="font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{w.app}}</span></span>
<span style="font-size: 11px; color: #a7a9ad; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">{{w.title}}</span>
</button>
</sc-for>
<sc-if value="{{p.empty}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: rgba(239,236,230,0.45);">Empty</span></sc-if>
</div>
</div>
</sc-for>
</div>

<footer style="display: flex; align-items: center; gap: 16px; font-size: 12px; color: #8c8f95;">
<span><span style="padding: 1px 6px; border-radius: 5px; background: #1c1e22; color: #c9c6bf;">1–8</span> Go to page</span>
<span>Click a window, then Move here</span>
<span><span style="padding: 1px 6px; border-radius: 5px; background: #1c1e22; color: #c9c6bf;">↵</span> Focus</span>
<span><span style="padding: 1px 6px; border-radius: 5px; background: #1c1e22; color: #c9c6bf;">Esc</span> Close</span>
</footer>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","default":"night-ridge","options":["night-ridge","aurora","ember-city"]},"$preview":{"width":1240,"height":580}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = {
      page: 2, picked: null, query: '',
      wins: [
        { id: 'k1', page: 1, app: 'kitty', title: '~/src/shale', x: 0, y: 0, w: 50, h: 100 },
        { id: 'k2', page: 1, app: 'kitty', title: 'python3 -m unittest', x: 50, y: 0, w: 50, h: 100 },
        { id: 'f1', page: 2, app: 'Firefox', title: 'Shale redesign notes', x: 0, y: 0, w: 62, h: 100 },
        { id: 'o1', page: 2, app: 'Obsidian', title: 'Rack · plan', x: 62, y: 0, w: 38, h: 100 },
        { id: 's1', page: 3, app: 'Spotify', title: 'Tame the Beast', x: 10, y: 10, w: 80, h: 80 },
        { id: 'd1', page: 5, app: 'Discord', title: '#shale', x: 0, y: 0, w: 100, h: 100 }
      ]
    };
  }
  stripes(wall) {
    // One signal and one second colour come from the wallpaper; "on" is the signal at low strength.
    const p = { 'night-ridge': ['#ff8a3d', '#7fb2c4'], 'aurora': ['#4fd1c5', '#d9b26a'], 'ember-city': ['#ff6b6b', '#8fb8a8'] }[wall] || ['#ff8a3d', '#7fb2c4'];
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(p[0].slice(i, i + 2), 16));
    const a = (x) => 'rgba(' + r + ',' + g + ',' + b + ',' + x + ')';
    return { a1: p[0], comp: p[1], soft: a(0.14), line: a(0.4) };
  }
  renderVals() {
    const wallId = this.props.wallpaper ?? 'night-ridge';
    const s = this.stripes(wallId);
    const wall = { 'night-ridge': { top: '#14233a', bottom: '#0a111a' }, 'aurora': { top: '#12303a', bottom: '#071419' }, 'ember-city': { top: '#3d1c1f', bottom: '#160a0b' } }[wallId] || { top: '#14233a', bottom: '#0a111a' };
    const st = this.state;
    const q = st.query.trim().toLowerCase();
    const picked = st.wins.find((w) => w.id === st.picked);
    const pages = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => {
      const mine = st.wins.filter((w) => w.page === n);
      const cur = st.page === n;
      const wins = mine.map((w) => {
        const on = st.picked === w.id, hit = !q || (w.app + ' ' + w.title).toLowerCase().includes(q);
        return { app: w.app, title: w.title, initial: w.app[0].toUpperCase(), on, x: w.x + '%', y: w.y + '%', w: w.w + '%', h: w.h + '%',
          tile: on ? s.a1 : '#c9c6bf', ring: on ? '0 0 0 2px ' + s.a1 : (q && hit ? '0 0 0 1px ' + s.line : '0 4px 12px rgba(0,0,0,0.35)'), dim: hit ? 1 : 0.3,
          pick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({ picked: on ? null : w.id }); } };
      });
      return {
        n, current: cur ? 'page' : 'false', wins, empty: mine.length === 0,
        meta: mine.length ? mine.length + (mine.length === 1 ? ' window' : ' windows') : '',
        numBg: cur ? s.a1 : '#24272c', numFg: cur ? '#17181a' : (mine.length ? '#efece6' : '#6b6f76'),
        ring: cur ? '0 0 0 2px ' + s.a1 : 'inset 0 0 0 1px rgba(255,255,255,0.05)',
        go: () => this.setState({ page: n }),
        canMove: !!picked && picked.page !== n,
        moveHere: () => {
          const spot = mine.length === 0 ? { x: 0, y: 0, w: 100, h: 100 } : { x: 20, y: 20, w: 60, h: 60 };
          this.setState({ wins: st.wins.map((w) => w.id === st.picked ? Object.assign({}, w, { page: n }, spot) : w), picked: null, page: n });
        }
      };
    });
    const status = picked ? picked.app + ' picked · choose a page' : 'Page ' + st.page + ' · ' + st.wins.length + ' windows open';
    return { s, wall, pages, status, query: st.query, onQuery: (e) => this.setState({ query: e.target.value }) };
  }
}
</script>
</body>
</html>
