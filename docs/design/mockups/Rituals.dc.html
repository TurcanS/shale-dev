<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack power rituals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&amp;family=Martian+Mono:wght@200..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0f11}
@keyframes rtBoot{0%{opacity:0;transform:translateY(10px) scale(.97)}60%{opacity:1;box-shadow:0 0 0 1px rgba(255,138,61,.6),0 0 24px rgba(255,138,61,.35)}100%{opacity:1;transform:none}}
@keyframes rtDown{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes rtWake{0%{opacity:.25}100%{opacity:1}}
@keyframes rtBreathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rtIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rt-boot{animation:rtBoot 520ms cubic-bezier(.2,.8,.2,1) both}
.rt-down{animation:rtDown 260ms ease-in both}
.rt-off{opacity:0}
.rt-sleep{opacity:.18;transition:opacity 900ms ease-out}
.rt-keep{opacity:.55;transition:opacity 900ms ease-out}
.rt-keep .rt-dot{animation:rtBreathe 2.4s ease-in-out infinite}
.rt-wake{animation:rtWake 320ms ease-out both}
.rt-in{animation:rtIn 240ms cubic-bezier(.2,.8,.2,1) both}
button{font:inherit;color:inherit;transition:background-color 140ms ease-out,transform 80ms ease-out}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #efece6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.rt-boot,.rt-down,.rt-wake,.rt-in,.rt-keep .rt-dot{animation:none}.rt-sleep,.rt-keep{transition:none}}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; padding: 32px; display: flex; gap: 28px; background: #0e0f11; font-family: 'Hanken Grotesk', sans-serif; color: #efece6;">

<div aria-label="Shale screen" role="img" style="position: relative; width: 1180px; height: 664px; flex: none; align-self: center; border-radius: 18px; overflow: hidden; background: #05070a; box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 30px 60px rgba(0,0,0,0.45);">
<svg width="1180" height="664" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0; opacity: {{wallOpacity}}; transition: opacity 600ms ease-out;">
<defs><linearGradient id="rtSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090f1a"></stop><stop offset="0.62" stop-color="#14233a"></stop><stop offset="1" stop-color="#1f3149"></stop></linearGradient></defs>
<rect width="1600" height="900" fill="url(#rtSky)"></rect>
<circle cx="1244" cy="186" r="34" fill="#e7e1d1" opacity="0.9"></circle>
<path d="M0 520 L120 460 L220 490 L340 410 L460 480 L560 430 L700 500 L820 390 L940 460 L1060 420 L1180 480 L1300 400 L1420 460 L1520 430 L1600 460 L1600 900 L0 900 Z" fill="#192739"></path>
<path d="M0 610 L160 550 L280 590 L420 530 L560 600 L700 560 L860 620 L1000 550 L1140 610 L1280 570 L1440 630 L1600 580 L1600 900 L0 900 Z" fill="#111c2a"></path>
<path d="M0 720 L200 680 L380 710 L560 660 L760 720 L980 680 L1180 730 L1400 690 L1600 720 L1600 900 L0 900 Z" fill="#0a111a"></path>
</svg>

<div style="position: absolute; left: 8px; right: 8px; top: 8px; height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 6px; box-sizing: border-box;">
<span aria-hidden="true" class="{{barCase.cls}}" style="position: absolute; inset: 0; border-radius: 12px; background: #121316; box-shadow: 0 0 0 1px rgba(255,255,255,0.06); animation-delay: 0ms;"></span>
<sc-for list="{{barMods}}" as="m" hint-placeholder-count="7">
<span class="{{m.cls}}" style="position: relative; margin-left: {{m.push}}; height: 26px; padding: 0 10px; border-radius: 9px; background: {{m.bg}}; color: {{m.fg}}; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; animation-delay: {{m.delay}};"><sc-if value="{{m.hasDot}}" hint-placeholder-val="{{ false }}"><span class="rt-dot" style="width: 6px; height: 6px; border-radius: 50%; background: {{m.dot}};"></span></sc-if>{{m.text}}</span>
</sc-for>
</div>

<div style="position: absolute; left: 18px; bottom: 18px; display: flex; gap: 10px; align-items: flex-end;">
<sc-for list="{{deskMods}}" as="m" hint-placeholder-count="4">
<div class="{{m.cls}}" style="width: {{m.w}}; height: 150px; box-sizing: border-box; padding: 14px; border-radius: 18px; background: rgba(18,19,22,0.8); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 4px; animation-delay: {{m.delay}};">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #a7a9ad;"><span class="rt-dot" style="width: 6px; height: 6px; border-radius: 50%; background: {{m.dot}};"></span>{{m.label}}</span>
<span style="font-weight: 600; font-size: {{m.bigSize}}; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">{{m.big}}</span>
<span style="margin-top: auto; font-size: 12px; color: #8c8f95;">{{m.small}}</span>
</div>
</sc-for>
</div>

<div role="status" aria-live="polite" style="position: absolute; right: 18px; bottom: 18px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(18,19,22,0.85); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{voiceColor}};"><span style="width: 7px; height: 7px; border-radius: 50%; background: currentColor;"></span>{{voice}}</div>

<sc-if value="{{showLock}}" hint-placeholder-val="{{ false }}">
<div class="rt-in" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
<span style="font-size: 16px; color: rgba(239,236,230,0.8);">Saturday, 25 October</span>
<span style="font-weight: 600; font-size: 120px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums;">21:44</span>
<span style="margin-top: 30px; width: 280px; height: 44px; box-sizing: border-box; padding: 0 6px 0 16px; border-radius: 22px; background: rgba(18,19,22,0.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); display: flex; align-items: center; font-size: 14px; color: rgba(239,236,230,0.45);">Password<span style="margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: #ff8a3d;"></span></span>
</div>
</sc-if>
</div>

<aside aria-label="Try the rituals" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<div style="padding: 4px 2px 6px;">
<div style="font-size: 13px; color: #8c8f95;">Character · 1</div>
<h1 style="margin: 4px 0 8px; font-weight: 650; font-size: 32px; letter-spacing: -0.02em;">Power rituals</h1>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #c9c6bf;">The shell starts, locks, rests and wakes the same way every time, so you always know what state it's in. Press each step.</p>
</div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.go}}" aria-pressed="{{s.on}}" style="padding: 14px; border-radius: 16px; border: 1px solid {{s.border}}; background: {{s.bg}}; display: flex; gap: 12px; text-align: left; cursor: pointer;">
<span style="width: 36px; height: 36px; flex: none; border-radius: 11px; background: {{s.tile}}; color: {{s.tileFg}}; display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
<span style="display: flex; align-items: baseline; gap: 8px;"><span style="font-weight: 600; font-size: 15px;">{{s.label}}</span><span style="margin-left: auto; padding: 1px 7px; border-radius: 6px; background: #24272c; font-size: 11px; color: #a7a9ad;">{{s.time}}</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #a7a9ad;">{{s.text}}</span>
</span>
</button>
</sc-for>
<button aria-pressed="{{sound}}" onClick="{{toggleSound}}" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 0; background: #1c1e22; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer;"><span style="flex: 1;"><span style="display: block; font-size: 14px;">Soft clicks</span><span style="font-size: 12px; color: #8c8f95;">Off by default</span></span><span aria-hidden="true" style="position: relative; width: 40px; height: 22px; border-radius: 11px; background: {{soundTrack}};"><span style="position: absolute; top: 3px; left: {{soundKnob}}; width: 16px; height: 16px; border-radius: 50%; background: #f4f2ee; transition: left 160ms ease-out;"></span></span></button>
<div style="flex: 1; min-height: 0; padding: 12px 14px; border-radius: 14px; background: #121316; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 6px; overflow: hidden;">
<span style="font-size: 12px; color: #8c8f95;">What the shell said</span>
<sc-for list="{{log}}" as="l" hint-placeholder-count="4"><span style="font-size: 13px; color: #c9c6bf;"><span style="font-family: 'Martian Mono', monospace; font-size: 11px; color: #6b6f76; margin-right: 8px;">{{l.t}}</span>{{l.text}}</span></sc-for>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { phase: 'on', sound: false, log: [['21:40', 'Started · 10 parts ready'], ['21:40', 'Good evening']] };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  say(text) { const t = new Date(); const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); this.setState({ log: this.state.log.concat([[hh, text]]).slice(-6) }); }
  click(freq, dur) {
    if (!this.state.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.05, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + (dur || 0.03));
      o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + (dur || 0.03));
    } catch (e) { /* sound is optional */ }
  }
  go(phase) {
    this.timers.forEach(clearTimeout); this.timers = [];
    if (phase === 'boot') {
      this.setState({ phase: 'boot' }); this.say('Starting');
      for (let i = 0; i < 11; i++) this.later(i * 90, () => this.click(520 + i * 40, 0.025));
      this.later(1400, () => { this.setState({ phase: 'on' }); this.say('Started · 10 parts ready'); this.click(880, 0.08); });
    } else if (phase === 'down') {
      this.setState({ phase: 'down' }); this.say('Locking');
      for (let i = 0; i < 11; i++) this.later(i * 50, () => this.click(700 - i * 40, 0.02));
      this.later(700, () => { this.setState({ phase: 'off' }); this.say('Locked'); });
    } else if (phase === 'sleep') {
      this.setState({ phase: 'sleep' }); this.say('Resting · away 5 min'); this.click(300, 0.12);
    } else if (phase === 'wake') {
      this.setState({ phase: 'wake' }); this.click(660, 0.04);
      this.later(380, () => { this.setState({ phase: 'on' }); this.say('Welcome back · 2 notifications came in'); });
    }
  }
  renderVals() {
    const st = this.state;
    const ph = st.phase;
    const sig = '#ff8a3d';
    // Boot lights parts left to right with a short glow; lock fades them right to left; rest dims all but the clock.
    const cls = (i, n, keep) => {
      if (ph === 'boot') return { cls: 'rt-boot', delay: (i * 90) + 'ms' };
      if (ph === 'down') return { cls: 'rt-down', delay: ((n - 1 - i) * 50) + 'ms' };
      if (ph === 'off') return { cls: 'rt-off', delay: '0ms' };
      if (ph === 'sleep') return { cls: keep ? 'rt-keep' : 'rt-sleep', delay: '0ms' };
      if (ph === 'wake') return { cls: 'rt-wake', delay: (i * 25) + 'ms' };
      return { cls: '', delay: '0ms' };
    };
    const bar = [
      ['Search', '#1c1e22', '#c9c6bf', '', '0'], ['● ● ● ●', '#1c1e22', '#8c8f95', '', '0'], ['Firefox · Shale redesign notes', 'transparent', '#c9c6bf', '', '0'],
      ['21:44 · Sat 25 Oct', 'transparent', '#efece6', '', 'auto'], ['Discord', 'rgba(255,138,61,0.14)', sig, sig, 'auto'], ['Wi-Fi · 62 · 82%', '#1c1e22', '#efece6', '', '0'], ['3', '#1c1e22', '#efece6', sig, '0']
    ];
    const barMods = bar.map(([text, bg, fg, dot, push], i) => Object.assign({ text, bg, fg, dot, hasDot: !!dot, push }, cls(i + 1, 11, false)));
    const desk = [
      ['Clock', '21:44', 'Saturday · 91% of the day', '220px', '44px', true],
      ['Sky', '11°', 'Light rain · sets 18:21', '180px', '40px', false],
      ['Note', '3 items', 'Buy coffee filters …', '180px', '26px', false],
      ['System', '12%', 'CPU · memory 41%', '160px', '34px', false]
    ];
    const deskMods = desk.map(([label, big, small, w, bigSize, keep], i) => Object.assign({ label, big, small, w, bigSize, dot: keep ? sig : '#6b6f76' }, cls(i + 7, 11, keep)));
    const voices = { on: ['Ready', '#c9c6bf'], boot: ['Starting …', '#efece6'], down: ['Locking …', sig], off: ['Locked', sig], sleep: ['Resting · press any key', '#8c8f95'], wake: ['Waking …', '#efece6'] };
    const active = { boot: 'boot', on: 'boot', down: 'down', off: 'down', sleep: 'sleep', wake: 'wake' }[ph];
    const steps = [
      ['Log in', 'boot', '1.4 s', 'M13 3L5 14h6l-1 7 8-11h-6z', 'Parts appear left to right with a short glow, and the shell says how many are ready.'],
      ['Lock', 'down', '0.7 s', 'M7 11h10v9H7zM9 11V8a3 3 0 0 1 6 0v3', 'Parts fade right to left, then the lock screen rises. Nothing else stays on.'],
      ['Step away', 'sleep', 'after 5 min', 'M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z', 'Everything dims; the clock stays faint and its dot breathes slowly.'],
      ['Come back', 'wake', '0.3 s', 'M12 5v14M5 12l7-7 7 7', 'Any key brings it back at once and tells you what came in while you were away.']
    ].map(([label, phase, time, icon, text]) => {
      const on = active === phase;
      return { label, time, icon, text, on, go: () => this.go(phase),
        bg: on ? 'rgba(255,138,61,0.14)' : '#1c1e22', border: on ? 'rgba(255,138,61,0.4)' : 'transparent', tile: on ? sig : '#2a2d33', tileFg: on ? '#17181a' : '#efece6' };
    });
    return {
      barMods, deskMods, steps, barCase: cls(0, 11, false),
      voice: voices[ph][0], voiceColor: voices[ph][1],
      wallOpacity: ph === 'off' ? 0.3 : (ph === 'sleep' ? 0.4 : 1),
      showLock: ph === 'off',
      sound: st.sound, toggleSound: () => this.setState({ sound: !st.sound }), soundTrack: st.sound ? sig : '#2a2d33', soundKnob: st.sound ? '21px' : '3px',
      log: st.log.map(([t, text]) => ({ t, text }))
    };
  }
}
</script>
</body>
</html>
