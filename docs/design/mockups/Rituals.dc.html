<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack power rituals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&amp;family=Martian+Mono:wght@200..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316}
@keyframes rtBoot{0%{filter:brightness(.1) saturate(0);opacity:.4}55%{filter:brightness(1.6) saturate(1.2);opacity:1}100%{filter:none;opacity:1}}
@keyframes rtLed{0%{background:#ffffff;box-shadow:0 0 10px #ffffff}30%{background:#e7e2d6}60%{background:#ff8a3d}100%{}}
@keyframes rtStripe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rtDown{0%{filter:none;opacity:1}40%{filter:brightness(1.4)}100%{filter:brightness(.1) saturate(0);opacity:.4}}
@keyframes rtWake{0%{filter:brightness(.2) saturate(.2)}60%{filter:brightness(1.3)}100%{filter:none}}
@keyframes rtBreathe{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rtLock{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.rt-boot{animation:rtBoot 520ms cubic-bezier(.2,.8,.2,1) both}
.rt-boot .rt-led{animation:rtLed 600ms steps(3) both;animation-delay:inherit}
.rt-boot .rt-stripe{transform-origin:left;animation:rtStripe 320ms cubic-bezier(.2,.8,.2,1) both;animation-delay:inherit}
.rt-down{animation:rtDown 300ms ease-in both}
.rt-off{filter:brightness(.1) saturate(0);opacity:.4}
.rt-sleep{filter:brightness(.22) saturate(.3);transition:filter 900ms ease-out}
.rt-keep{filter:brightness(.55) saturate(.6);transition:filter 900ms ease-out}
.rt-keep .rt-led{animation:rtBreathe 2.4s ease-in-out infinite}
.rt-wake{animation:rtWake 320ms ease-out both}
.rt-lockmod{animation:rtLock 220ms cubic-bezier(.2,.8,.2,1) both}
button{font:inherit;color:inherit;transition:transform 70ms ease-out,filter 120ms ease-out}
button:hover{filter:brightness(1.15)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #efece6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.rt-boot,.rt-down,.rt-wake,.rt-lockmod,.rt-boot .rt-led,.rt-boot .rt-stripe,.rt-keep .rt-led{animation:none}.rt-sleep,.rt-keep{transition:none}}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; background: #121316; padding: 28px; display: flex; gap: 28px; font-family: 'Hanken Grotesk', sans-serif; color: #efece6;">

<div aria-label="Shale screen" role="img" style="position: relative; width: 1220px; height: 686px; flex: none; border-radius: 6px; overflow: hidden; background: #05070a; box-shadow: 0 0 0 10px #1b1c1f, 0 0 0 11px #2c2e33;">
<svg width="1220" height="686" viewBox="0 0 1600 900" preserveAspectRatio="none" style="position: absolute; inset: 0; opacity: {{wallOpacity}}; transition: opacity 600ms ease-out;" aria-hidden="true">
<defs><linearGradient id="rtSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090f1a"></stop><stop offset="0.62" stop-color="#14233a"></stop><stop offset="1" stop-color="#1f3149"></stop></linearGradient></defs>
<rect width="1600" height="900" fill="url(#rtSky)"></rect>
<circle cx="1244" cy="186" r="34" fill="#e7e1d1" opacity="0.9"></circle>
<path d="M0 520 L120 460 L220 490 L340 410 L460 480 L560 430 L700 500 L820 390 L940 460 L1060 420 L1180 480 L1300 400 L1420 460 L1520 430 L1600 460 L1600 900 L0 900 Z" fill="#192739"></path>
<path d="M0 610 L160 550 L280 590 L420 530 L560 600 L700 560 L860 620 L1000 550 L1140 610 L1280 570 L1440 630 L1600 580 L1600 900 L0 900 Z" fill="#111c2a"></path>
<path d="M0 720 L200 680 L380 710 L560 660 L760 720 L980 680 L1180 730 L1400 690 L1600 720 L1600 900 L0 900 Z" fill="#0a111a"></path>
</svg>

<div style="position: absolute; left: 0; top: 0; right: 0; height: 34px; background: #121316; display: flex; align-items: center; gap: 3px; padding: 0 3px;">
<sc-for list="{{barMods}}" as="m" hint-placeholder-count="6">
<div class="{{m.cls}}" style="position: relative; height: 28px; margin-left: {{m.push}}; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: linear-gradient(rgba(255,138,61,0.05), rgba(255,138,61,0.05)) #1c1e22; border-radius: 16px; overflow: hidden; animation-delay: {{m.delay}};">
<span class="rt-stripe" style="position: absolute; left: 0; top: 0; right: 0; height: 3px; background: #3c3f45;"></span>
<span class="rt-led" style="width: 6px; height: 6px; border-radius: 50%; background: {{m.led}};"></span>
<span style="font-weight: 700; font-size: 11px; letter-spacing: 0.01em; white-space: nowrap;">{{m.text}}</span>
</div>
</sc-for>
</div>

<div style="position: absolute; left: 18px; bottom: 18px; display: flex; flex-direction: column;">
<div style="display: flex; gap: 3px; background: #121316; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06); padding: 6px;">
<sc-for list="{{deskMods}}" as="m" hint-placeholder-count="4">
<div class="{{m.cls}}" style="position: relative; width: {{m.w}}; height: 150px; background: {{m.face}}; border-radius: 6px; overflow: hidden; animation-delay: {{m.delay}};">
<span class="rt-stripe" style="position: absolute; left: 0; top: 0; right: 0; height: 5px; background: #3c3f45;"></span>
<div style="padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; gap: 6px;"><span class="rt-led" style="width: 7px; height: 7px; border-radius: 50%; background: {{m.led}}; box-shadow: 0 0 6px {{m.led}};"></span><span style="font-weight: 650; font-size: 11px; letter-spacing: 0.01em;">{{m.label}}</span></div>
<span style="font-family: 'Martian Mono', monospace; font-weight: 250; font-size: {{m.bigSize}}; line-height: 1.05; letter-spacing: -0.05em;">{{m.big}}</span>
<span style="font-size: 12px; color: #c9c6bf;">{{m.small}}</span>
</div>
</div>
</sc-for>
</div>
</div>

<div role="status" aria-live="polite" style="position: absolute; right: 18px; bottom: 18px; height: 30px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 10px; background: rgba(16,17,19,0.85); font-family: 'Martian Mono', monospace; font-size: 12px; color: {{voiceColor}};"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{voiceColor}};"></span>{{voice}}</div>

<sc-if value="{{showLockMod}}" hint-placeholder-val="{{ false }}">
<div class="rt-lockmod" style="position: absolute; left: 430px; top: 250px; width: 360px; background: linear-gradient(rgba(255,138,61,0.05), rgba(255,138,61,0.05)) #1c1e22; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.7);">

<div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px;">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 11px; letter-spacing: 0.01em;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ff8a3d; box-shadow: 0 0 8px #ff8a3d;"></span>Locked · fly</span>
<span style="font-family: 'Martian Mono', monospace; font-weight: 200; font-size: 64px; line-height: 1; letter-spacing: -0.06em;">21:44</span>
<span style="font-size: 13px; color: #c9c6bf;">Only the lock module stays powered. Press LOG IN.</span>
</div>
</div>
</sc-if>
</div>

<aside aria-label="Try the rituals" style="flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0;">
<div>
<div style="font-weight: 650; font-size: 12px; letter-spacing: 0.2em; color: #a7a9ad;">Character · 1</div>
<h1 style="margin: 4px 0 0; font-family: 'Martian Mono', monospace; font-weight: 250; font-size: 34px; letter-spacing: -0.05em;">Power rituals</h1>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: #c9c6bf;">The rack is a machine that powers on, powers down and sleeps, the same way every time. Press each step.</p>
</div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.go}}" aria-pressed="{{s.on}}" style="text-align: left; padding: 0; border: 0; border-radius: 10px; background: linear-gradient(rgba(255,138,61,0.05), rgba(255,138,61,0.05)) #1c1e22; overflow: hidden; cursor: pointer; color: #efece6; box-shadow: {{s.ring}};">

<span style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px;">
<span style="display: flex; align-items: center; gap: 8px;"><span style="font-family: 'Martian Mono', monospace; font-size: 12px; color: {{s.c}};">{{s.n}}</span><span style="font-weight: 650; font-size: 13px; letter-spacing: 0.01em;">{{s.label}}</span><span style="margin-left: auto; font-family: 'Martian Mono', monospace; font-size: 11px; color: #a7a9ad;">{{s.time}}</span></span>
<span style="font-size: 13px; line-height: 1.45; color: #c9c6bf;">{{s.text}}</span>
</span>
</button>
</sc-for>
<button aria-pressed="{{sound}}" onClick="{{toggleSound}}" style="height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.07); background: #272a2f; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 650; font-size: 11px; letter-spacing: 0.01em; cursor: pointer;"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{soundLed}};"></span>SOFT CLICKS {{soundWord}} · OPT-IN</button>
<div style="margin-top: auto; background: #141518; border-radius: 10px; padding: 10px 12px; font-family: 'Martian Mono', monospace; font-size: 11px; line-height: 1.7; color: #a7a9ad;">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4"><div>{{l}}</div></sc-for>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { phase: 'on', sound: false, log: ['21:40 Self-test · 10 modules OK', '21:40 Good evening, fly'] };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach(clearTimeout); }
  later(ms, fn) { this.timers.push(setTimeout(fn, ms)); }
  say(text) { const t = new Date(); const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); this.setState({ log: this.state.log.concat([hh + ' ' + text]).slice(-5) }); }
  click(freq, dur) {
    if (!this.state.sound) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.04, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + (dur || 0.03));
      o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + (dur || 0.03));
    } catch (e) { /* sound is optional */ }
  }
  go(phase) {
    this.timers.forEach(clearTimeout); this.timers = [];
    if (phase === 'boot') {
      this.setState({ phase: 'boot' }); this.say('Powering on');
      for (let i = 0; i < 10; i++) this.later(i * 110, () => this.click(520 + i * 40, 0.025));
      this.later(1500, () => { this.setState({ phase: 'on' }); this.say('Self-test · 10 modules OK'); this.click(880, 0.08); });
    } else if (phase === 'down') {
      this.setState({ phase: 'down' }); this.say('Powering down');
      for (let i = 0; i < 10; i++) this.later(i * 70, () => this.click(700 - i * 40, 0.02));
      this.later(900, () => { this.setState({ phase: 'off' }); this.say('Locked · lock module only'); });
    } else if (phase === 'sleep') {
      this.setState({ phase: 'sleep' }); this.say('Standby · away 5 min'); this.click(300, 0.12);
    } else if (phase === 'wake') {
      this.setState({ phase: 'wake' }); this.click(660, 0.04);
      this.later(380, () => { this.setState({ phase: 'on' }); this.say('Welcome back · 2 notes came in'); });
    }
  }
  renderVals() {
    const st = this.state;
    const ph = st.phase;
    const cls = (i, n, keep) => {
      if (ph === 'boot') return { cls: 'rt-boot', delay: (i * 110) + 'ms' };
      if (ph === 'down') return { cls: 'rt-down', delay: ((n - 1 - i) * 70) + 'ms' };
      if (ph === 'off') return { cls: 'rt-off', delay: '0ms' };
      if (ph === 'sleep') return { cls: keep ? 'rt-keep' : 'rt-sleep', delay: '0ms' };
      if (ph === 'wake') return { cls: 'rt-wake', delay: (i * 25) + 'ms' };
      return { cls: '', delay: '0ms' };
    };
    const bar = [
      ['#3c3f45', '#e7e2d6', 'Find · 1 2 3', '0'], ['transparent', '#8c8f95', 'Shale redesign notes', '0'], ['#3c3f45', '#e7e2d6', '21:44 · Sat 24 Oct', 'auto'],
      ['#3c3f45', '#ff8a3d', 'Mic live', 'auto'], ['#3c3f45', '#e7e2d6', 'Wi-Fi · vol 62 · 82%', '0'], ['#3c3f45', '#ff8a3d', 'Notes 3', '0']
    ];
    const barMods = bar.map(([stripe, led, text, push], i) => Object.assign({ stripe, led, text, push }, cls(i, 10, false)));
    const desk = [
      ['Clock', '#e7e2d6', '21:44', 'Sat 24 Oct · day 91%', '210px', '44px', true],
      ['Sky', '#e7e2d6', '11°', 'Light rain · set 18:21', '170px', '44px', false],
      ['Note', '#e7e2d6', '3', 'Buy coffee filters …', '170px', '44px', false],
      ['System', '#e7e2d6', '12%', 'CPU · mem 41% · 48°', '150px', '44px', false]
    ];
    const deskMods = desk.map(([label, c, big, small, w, bigSize, keep], i) => Object.assign({ label, stripe: label === 'Clock' ? '#4a4f56' : (label === 'Note' ? '#4a433c' : '#3c3f45'), led: c, big, small, w, bigSize,
      face: label === 'Clock' ? '#1c1e22' : (label === 'Note' ? '#1c1e22' : 'linear-gradient(rgba(255,138,61,0.05), rgba(255,138,61,0.05)) #1c1e22') }, cls(i + 6, 10, keep)));
    const voices = { on: ['Ready', '#e7e2d6'], boot: ['Self-test …', '#efece6'], down: ['Powering down …', '#ff8a3d'], off: ['Locked', '#ff8a3d'], sleep: ['Standby · press any key', '#8c8f95'], wake: ['Waking …', '#efece6'] };
    const active = { boot: 'boot', on: 'boot', down: 'down', off: 'down', sleep: 'sleep', wake: 'wake' }[ph];
    const steps = [
      ['01', 'Log in', 'boot', '#ff8a3d', '1.4 s', 'Modules power on left to right, every light runs a quick test, and the rack reports how many modules are OK.'],
      ['02', 'Lock', 'down', '#ff8a3d', '0.6 s', 'Modules power down right to left; only the lock module keeps its light.'],
      ['03', 'Step away', 'sleep', '#ff8a3d', 'after 5 min', 'Everything dims to standby; the clock stays faint and one light breathes slowly.'],
      ['04', 'Come back', 'wake', '#ff8a3d', '0.3 s', 'Any key: a quick sweep, and the rack tells you what came in while you were gone.']
    ].map(([n, label, phase, c, time, text]) => ({ n, label, c, time, text, on: active === phase, ring: active === phase ? '0 0 0 2px ' + c : 'none', go: () => this.go(phase) }));
    return {
      barMods, deskMods, steps,
      voice: voices[ph][0], voiceColor: voices[ph][1],
      wallOpacity: ph === 'off' ? 0.25 : (ph === 'sleep' ? 0.35 : 1),
      showLockMod: ph === 'off',
      sound: st.sound, toggleSound: () => this.setState({ sound: !st.sound }), soundWord: st.sound ? 'On' : 'Off', soundLed: st.sound ? '#ff8a3d' : '#3a3d42',
      log: st.log
    };
  }
}
</script>
</body>
</html>
