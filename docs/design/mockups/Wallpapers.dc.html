<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rack wallpapers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&amp;family=Martian+Mono:wght@200..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;transition:background-color 140ms ease-out,box-shadow 140ms ease-out,transform 80ms ease-out}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid #efece6;outline-offset:2px}
@media (prefers-reduced-motion: reduce){button{transition:none}}
</style>
</helmet>
<section aria-label="Wallpapers" style="width: 840px; height: 500px; box-sizing: border-box; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: #121316; border-radius: 22px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 30px 60px rgba(0,0,0,0.35); font-family: 'Hanken Grotesk', sans-serif; color: #efece6;">

<header style="display: flex; align-items: center; gap: 12px; height: 32px;">
<span style="font-weight: 650; font-size: 17px;">Wallpapers</span>
<div role="tablist" aria-label="Source" style="display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: #1c1e22;">
<sc-for list="{{sources}}" as="o" hint-placeholder-count="3"><button role="tab" aria-selected="{{o.on}}" onClick="{{o.pick}}" style="height: 26px; padding: 0 12px; border-radius: 7px; border: 0; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.shadow}}; font-weight: 600; font-size: 12px; cursor: pointer;">{{o.label}}</button></sc-for>
</div>
<label style="margin-left: auto; display: flex; align-items: center; gap: 8px; width: 200px; height: 32px; padding: 0 10px; box-sizing: border-box; border-radius: 10px; background: #1c1e22;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8c8f95" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM15.5 15.5L20 20"></path></svg><input placeholder="Search" aria-label="Search wallpapers" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #efece6; font: 13px 'Hanken Grotesk', sans-serif;"></label>
<button aria-label="Close" style="width: 32px; height: 32px; border-radius: 10px; border: 0; background: #1c1e22; display: grid; place-items: center; cursor: pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<div style="flex: 1; min-height: 0; display: flex; gap: 12px;">
<div style="width: 480px; flex: none; display: flex; flex-direction: column; gap: 10px;">
<div style="position: relative; height: 270px; border-radius: 16px; overflow: hidden;">
<svg width="480" height="270" viewBox="0 0 480 270" aria-hidden="true" style="display: block;"><rect width="480" height="270" fill="{{cur.sky}}"></rect><circle cx="372" cy="62" r="24" fill="{{cur.sun}}" opacity="0.92"></circle><path d="M0 160 L60 132 L120 148 L190 110 L250 140 L320 118 L400 150 L480 128 L480 270 L0 270 Z" fill="{{cur.far}}"></path><path d="M0 200 L90 176 L180 196 L280 170 L380 196 L480 178 L480 270 L0 270 Z" fill="{{cur.mid}}"></path><path d="M0 232 L120 216 L240 230 L360 214 L480 228 L480 270 L0 270 Z" fill="{{cur.near}}"></path></svg>
<span aria-hidden="true" style="position: absolute; left: 10px; right: 10px; top: 8px; height: 12px; border-radius: 5px; background: rgba(18,19,22,0.85);"></span>
<span aria-hidden="true" style="position: absolute; right: 12px; top: 28px; width: 92px; height: 120px; border-radius: 8px; background: rgba(18,19,22,0.9);"><span style="position: absolute; left: 8px; right: 8px; top: 8px; height: 18px; border-radius: 4px; background: {{cur.soft}};"></span><span style="position: absolute; left: 8px; right: 30px; top: 34px; height: 4px; border-radius: 2px; background: {{cur.a1}};"></span></span>
<sc-if value="{{caption}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: rgba(239,236,230,0.8);">{{cur.name}}</span></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 10px;">
<span style="display: flex; flex-direction: column; flex: 1; min-width: 0;"><span style="font-weight: 650; font-size: 16px;">{{cur.name}}</span><span style="font-size: 12px; color: #8c8f95;">{{cur.file}} · 2560×1440</span></span>
<sc-for list="{{cur.chips}}" as="c" hint-placeholder-count="4"><span title="{{c.role}} {{c.hex}}" style="width: 26px; height: 26px; border-radius: 8px; background: {{c.c}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);"></span></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<div role="radiogroup" aria-label="Fit" style="display: flex; padding: 3px; gap: 2px; border-radius: 10px; background: #1c1e22;">
<sc-for list="{{fits}}" as="f" hint-placeholder-count="3"><button role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="height: 28px; padding: 0 12px; border-radius: 7px; border: 0; background: {{f.bg}}; color: {{f.fg}}; box-shadow: {{f.shadow}}; font-weight: 600; font-size: 12px; cursor: pointer;">{{f.label}}</button></sc-for>
</div>
<button aria-pressed="{{caption}}" onClick="{{toggleCaption}}" style="height: 34px; padding: 0 12px; border-radius: 10px; border: 0; background: #1c1e22; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 12px; cursor: pointer;"><span aria-hidden="true" style="position: relative; width: 28px; height: 16px; border-radius: 8px; background: {{capTrack}};"><span style="position: absolute; top: 2px; left: {{capKnob}}; width: 12px; height: 12px; border-radius: 50%; background: #f4f2ee;"></span></span>Caption</button>
<button onClick="{{apply}}" disabled="{{isApplied}}" style="margin-left: auto; height: 34px; padding: 0 16px; border-radius: 10px; border: 0; background: {{applyBg}}; color: {{applyFg}}; font-weight: 650; font-size: 13px; cursor: pointer;">{{applyText}}</button>
</div>
</div>

<div style="flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 96px; gap: 8px; align-content: start;">
<sc-for list="{{walls}}" as="w" hint-placeholder-count="3">
<button onClick="{{w.pick}}" aria-pressed="{{w.on}}" aria-label="{{w.name}}" style="position: relative; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: transparent; box-shadow: {{w.ring}}; cursor: pointer;">
<svg width="100%" height="100%" viewBox="0 0 160 96" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block;"><rect width="160" height="96" fill="{{w.sky}}"></rect><circle cx="120" cy="24" r="9" fill="{{w.sun}}"></circle><path d="M0 58 L30 46 L60 54 L95 38 L125 52 L160 44 L160 96 L0 96 Z" fill="{{w.far}}"></path><path d="M0 76 L50 66 L100 76 L160 64 L160 96 L0 96 Z" fill="{{w.near}}"></path></svg>
<span style="position: absolute; left: 8px; bottom: 6px; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{w.a1}};"></span>{{w.name}}</span>
<sc-if value="{{w.applied}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 6px; top: 6px; padding: 2px 7px; border-radius: 6px; background: rgba(18,19,22,0.85); font-size: 11px; font-weight: 600;">In use</span></sc-if>
</button>
</sc-for>
<button style="border-radius: 12px; border: 1.5px dashed #3a3d42; background: transparent; color: #a7a9ad; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 12px; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a folder</button>
<p style="grid-column: 1 / -1; margin: 4px 2px 0; font-size: 12px; line-height: 1.5; color: #8c8f95;">Each wallpaper gives the shell its accent colour and a second colour for charts. The dots are what you get.</p>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wallpaper":{"editor":"enum","default":"night-ridge","options":["night-ridge","aurora","ember-city"]},"onPick":{"editor":null},"$preview":{"width":840,"height":500}}'>
class Component extends DCLogic {
  constructor(...args) { super(...args); this.state = { sel: null, source: 'local', caption: true, fit: 'fill' }; }
  stripes(wall) {
    // One signal and one second colour come from the wallpaper; "on" is the signal at low strength.
    const p = { 'night-ridge': ['#ff8a3d', '#7fb2c4'], 'aurora': ['#4fd1c5', '#d9b26a'], 'ember-city': ['#ff6b6b', '#8fb8a8'] }[wall] || ['#ff8a3d', '#7fb2c4'];
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(p[0].slice(i, i + 2), 16));
    const a = (x) => 'rgba(' + r + ',' + g + ',' + b + ',' + x + ')';
    return { a1: p[0], comp: p[1], soft: a(0.25), line: a(0.4) };
  }
  renderVals() {
    const st = this.state;
    const applied = this.props.wallpaper ?? 'night-ridge';
    const sel = st.sel || applied;
    const data = [
      { id: 'night-ridge', file: 'night-ridge.png', name: 'Night ridge', sky: '#14233a', sun: '#e7e1d1', far: '#22344d', mid: '#111c2a', near: '#0a111a' },
      { id: 'aurora', file: 'aurora.png', name: 'Aurora', sky: '#0b1d26', sun: '#4fd1c5', far: '#12303a', mid: '#0d2229', near: '#071419' },
      { id: 'ember-city', file: 'ember-city.jpg', name: 'Ember city', sky: '#2a1416', sun: '#ff6b6b', far: '#3d1c1f', mid: '#2a1215', near: '#160a0b' }
    ];
    const walls = data.map((w) => { const ws = this.stripes(w.id); return Object.assign({}, w, { a1: ws.a1, on: sel === w.id, applied: applied === w.id, pick: () => this.setState({ sel: w.id }), ring: sel === w.id ? '0 0 0 2px ' + ws.a1 : 'inset 0 0 0 1px rgba(255,255,255,0.06)' }); });
    const c = data.find((w) => w.id === sel) || data[0];
    const cs = this.stripes(c.id);
    const cur = Object.assign({}, c, { a1: cs.a1, soft: cs.soft, chips: [['Accent', cs.a1], ['Second', cs.comp], ['Surface', '#1c1e22'], ['Sky', c.sky]].map(([role, h]) => ({ role, c: h, hex: h })) });
    const seg = (curv, list, key) => list.map(([id, label]) => ({ label, on: curv === id, pick: () => this.setState({ [key]: id }), bg: curv === id ? '#2c2f35' : 'transparent', fg: curv === id ? '#ffffff' : '#a7a9ad', shadow: curv === id ? '0 1px 3px rgba(0,0,0,0.4)' : 'none' }));
    const isApplied = sel === applied;
    return {
      walls, cur, sources: seg(st.source, [['local', 'Local'], ['wallhaven', 'Wallhaven'], ['wpc', 'Wallpapers.com']], 'source'),
      fits: seg(st.fit, [['fill', 'Fill'], ['fit', 'Fit'], ['center', 'Centre']], 'fit'),
      apply: () => { if (this.props.onPick) this.props.onPick(sel); }, isApplied,
      applyText: isApplied ? 'In use' : 'Use wallpaper', applyBg: isApplied ? '#1c1e22' : cs.a1, applyFg: isApplied ? '#8c8f95' : '#17181a',
      caption: st.caption, toggleCaption: () => this.setState({ caption: !st.caption }), capTrack: st.caption ? cs.a1 : '#2a2d33', capKnob: st.caption ? '14px' : '2px'
    };
  }
}
</script>
</body>
</html>
